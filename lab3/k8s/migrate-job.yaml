# Разова міграція схеми: чекає готовності бази і виконує db/schema.sql (ConfigMap schema).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        role: infra
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - until pg_isready -h db -U telemed -d telemed; do sleep 1; done;
              psql -v ON_ERROR_STOP=1 -h db -U telemed -d telemed -f /schema/schema.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: schema
