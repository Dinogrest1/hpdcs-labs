# Кластер варіанта 26: один control-plane (під інфраструктуру, мітка role=infra
# ставиться командою розгортання) і два worker для подів web.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: telemed
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080      # NodePort сервісу web
        hostPort: 8080
      - containerPort: 30090      # NodePort Prometheus
        hostPort: 9090
  - role: worker
  - role: worker
